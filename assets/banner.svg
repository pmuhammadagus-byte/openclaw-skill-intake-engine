<svg width="860" height="320" viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#19e3ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#19e3ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="320" rx="22" fill="url(#bg)"/>

  <!-- Shield/magnifier mark -->
  <g filter="url(#glow)">
    <path d="M118 70 L150 82 V118 Q150 150 118 162 Q86 150 86 118 V82 Z" fill="url(#mark)"/>
  </g>
  <circle cx="120" cy="112" r="20" fill="none" stroke="#0b1020" stroke-width="6"/>
  <line x1="134" y1="126" x2="150" y2="142" stroke="#0b1020" stroke-width="7" stroke-linecap="round"/>
  <!-- shield check -->
  <path d="M108 110 l8 8 l14 -16" fill="none" stroke="#0b1020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title + tagline -->
  <text x="210" y="92" fill="#ffffff" font-size="40" font-weight="bold">Skill Intake Engine</text>
  <text x="212" y="132" fill="#9fb0d9" font-size="18">Analyze, validate &amp; prepare OpenClaw skills before integration.</text>
  <rect x="210" y="152" width="440" height="3" rx="1.5" fill="url(#brand)"/>

  <!-- Feature pills -->
  <g>
    <rect x="210" y="178" width="150" height="40" rx="20" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="226" y="203" fill="#cbd5e1" font-size="15" font-weight="bold">🔍 Analyze</text>
    <rect x="372" y="178" width="150" height="40" rx="20" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="388" y="203" fill="#cbd5e1" font-size="15" font-weight="bold">✅ Validate</text>
    <rect x="534" y="178" width="160" height="40" rx="20" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="550" y="203" fill="#cbd5e1" font-size="15" font-weight="bold">🛡️ Redact keys</text>
    <rect x="706" y="178" width="120" height="40" rx="20" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="724" y="203" fill="#cbd5e1" font-size="15" font-weight="bold">📋 Registry</text>
  </g>

  <!-- Install hint -->
  <text x="212" y="256" fill="#64748b" font-size="14">Install:</text>
  <rect x="282" y="238" width="448" height="34" rx="10" fill="#0b1020" stroke="#2a335c"/>
  <text x="298" y="260" fill="#19e3ff" font-size="13" font-weight="bold" font-family="monospace">openclaw plugins install clawhub:&lt;owner&gt;/openclaw-skill-intake-engine</text>

  <!-- Footer -->
  <text x="212" y="300" fill="#6d5efc" font-size="14" font-weight="bold">✦ Made with Clara · OpenClaw plugin · secure by design</text>
</svg>
